version: '3.8'

services:
  # ==========================================
  # SERVICE DISCOVERY (Stateful - 1 Replica)
  # ==========================================
  service-discovery:
    image: car-pooling/service-discovery:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network

  # ==========================================
  # IDENTITY SERVICE (Stateless - 3 Replicas)
  # ==========================================
  identity-service:
    image: car-pooling/identity:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 768M
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: identity-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # VEHICLES SERVICE (Stateless - 3 Replicas)
  # ==========================================
  vehicles-service:
    image: car-pooling/vehicles:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 768M
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/vehicles_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: vehicles-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # TRIPS SERVICE (Stateless - 3 Replicas)
  # ==========================================
  trips-service:
    image: car-pooling/trips:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 768M
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/trips_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: trips-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # PAYMENTS SERVICE (Stateless - 3 Replicas)
  # ==========================================
  payments-service:
    image: car-pooling/payments:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/carpooling_payments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: payments-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # GPS SERVICE (Stateless - 3 Replicas)
  # ==========================================
  gps-service:
    image: car-pooling/gps:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/gps_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: gps-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # NOTIFICATIONS SERVICE
  # ==========================================
  notifications-service:
    image: car-pooling/notifications:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_server:5432/notifications_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: notifications-service
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery


  # ==========================================
  # CLOUD GATEWAY (Stateless - 2 Replicas)
  # ==========================================
  cloud-gateway:
    image: car-pooling/cloud-gateway:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: cloud-gateway
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0"
    networks:
      - carpooling_network
    depends_on:
      - service-discovery

  # ==========================================
  # FRONTEND SERVICE
  # ==========================================
  web-service:
    image: car-pooling/frontend:${FRONTEND_IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "3003:3002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      GATEWAY_URL: http://cloud-gateway:8888
    hostname: car-pooling-frontend
    networks:
      - carpooling_network
    depends_on:
      - service-discovery
      - cloud-gateway

  # ==========================================
  # MONITORING (Prometheus + Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - carpooling_network

  loki:
    image: grafana/loki:2.9.4
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - carpooling_network

  promtail:
    image: grafana/promtail:2.9.4
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    networks:
      - carpooling_network

  grafana:
    image: grafana/grafana:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - carpooling_network

networks:
  carpooling_network:
    external: true

volumes:
  portainer_data:
  grafana_data:
