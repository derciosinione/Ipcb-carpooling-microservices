spring.application.name=car-pooling-gps-api
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5434/gps_db
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=car-pooling-gps-api

# Security Config for JWT token
security.token.secret="15fffccd-dfbc-4580-868d-e55d4c400264Carpooling"
security.token.issuer="carpooling"

gps.nominatim.base-url=https://nominatim.openstreetmap.org
gps.nominatim.user-agent=IPCB-CarPooling/1.0
