global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "service-discovery"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service-discovery:8761"]

  - job_name: "identity-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: "vehicles-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vehicles-service:8081"]

  - job_name: "trips-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trips-service:8083"]

  - job_name: "payments-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payments-service:8084"]

  - job_name: "gps-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gps-service:8085"]

  - job_name: "notifications-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-service:8086"]

  - job_name: "cloud-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cloud-gateway:8888"]
