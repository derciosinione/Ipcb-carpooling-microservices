version: "3.9"

services:
  app:
    build: .
    container_name: car_pooling_payments_api
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_server:5432/carpooling_payments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: learnJava!2025
    networks:
      - carpooling_network

networks:
  carpooling_network:
    external: true
