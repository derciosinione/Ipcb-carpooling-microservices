spring.application.name=car-pooling-payments-api
server.port=8084

# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=car-pooling-payments-api

# DB do PAYMENTS (porta 5443)
spring.datasource.url=jdbc:postgresql://localhost:5443/carpooling_payments
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Config for JWT token
security.token.secret="15fffccd-dfbc-4580-868d-e55d4c400264Carpooling"
security.token.issuer="carpooling"

# Eureka Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# URL do microservico Trips (para o Feign usar)
clients.trips.base-url=http://localhost:8083
