spring.application.name=car-pooling-payments-api
server.port=8084

# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# DB do PAYMENTS (porta 5443)
spring.datasource.url=jdbc:postgresql://localhost:5443/carpooling_payments
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# URL do microservico Trips (para o Feign usar)
clients.trips.base-url=http://localhost:8083

