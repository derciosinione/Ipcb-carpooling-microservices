spring.application.name=car-pooling-trips-api
server.port=8083

# DATABASE CONFIG (Docker-ready)
spring.datasource.url=jdbc:postgresql://db_server:5432/trips_db
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
