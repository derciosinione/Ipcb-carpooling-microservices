spring.application.name=car-pooling-trips-api
server.port=8083

# DATABASE CONFIG (Docker-ready)
spring.datasource.url=jdbc:postgresql://db_server:5432/trips_db
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security Config (matching other services)
security.token.secret="15fffccd-dfbc-4580-868d-e55d4c400264Carpooling"
security.token.issuer="carpooling"

eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=trips-service

spring.cloud.circuitbreaker.resilience4j.enabled=true
resilience4j.circuitbreaker.instances.gpsReverse.slidingWindowSize=10
resilience4j.circuitbreaker.instances.gpsReverse.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.gpsReverse.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.gpsReverse.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gpsReverse.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.gpsDistance.slidingWindowSize=10
resilience4j.circuitbreaker.instances.gpsDistance.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.gpsDistance.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.gpsDistance.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gpsDistance.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notifications.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notifications.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.notifications.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.notifications.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notifications.waitDurationInOpenState=10s

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.metrics.tags.application=car-pooling-trips-api
