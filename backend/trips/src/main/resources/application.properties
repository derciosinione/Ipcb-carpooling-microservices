spring.application.name=car-pooling-trips-api
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5434/trips_db
spring.datasource.username=postgres
spring.datasource.password=learnJava!2025
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
