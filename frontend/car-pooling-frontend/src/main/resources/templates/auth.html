<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/auth-layout}">
<head>
    <title>CarPooling - Autenticação</title>
</head>
<body>
    <div layout:fragment="content" class="h-screen w-full flex flex-col relative overflow-hidden font-sans antialiased text-slate-900 selection:bg-primary/30">
        
        <!-- Cinematic Mesh Gradient Background -->
        <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px] animate-pulse"></div>
            <div class="absolute top-[20%] -right-[5%] w-[35%] h-[35%] rounded-full bg-blue-500/10 blur-[100px]"></div>
            <div class="absolute -bottom-[10%] left-[20%] w-[45%] h-[45%] rounded-full bg-indigo-500/15 blur-[130px] animate-pulse" style="animation-delay: 2s;"></div>
            <div class="absolute bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[150px]"></div>
            
            <!-- Subtle Grid Pattern Overlay -->
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]"></div>
        </div>

        <!-- Início Link - Ultra Compact -->
        <div class="relative z-10 px-6 py-4">
            <a th:href="@{/}" class="group inline-flex items-center gap-2 text-xs font-semibold tracking-wide uppercase text-muted-foreground hover:text-primary transition-all duration-300">
                <i data-lucide="arrow-left" class="h-4 w-4 transition-transform group-hover:-translate-x-1"></i>
                <span class="opacity-80 group-hover:opacity-100">Início</span>
            </a>
        </div>
        
        <div class="relative z-10 flex-1 flex items-center justify-center p-4">
            <!-- Glassmorphic Card -->
            <div class="w-full max-w-sm backdrop-blur-xl bg-white/70 dark:bg-slate-950/70 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] border border-white/40 dark:border-white/10 rounded-2xl overflow-hidden transform transition-all duration-500 hover:shadow-[0_20px_50px_rgba(0,0,0,0.1)]">
                
                <!-- Introduction - Premium Styling -->
                <div class="p-6 text-center space-y-2">
                    <div class="mx-auto bg-gradient-to-br from-primary/20 to-primary/5 p-3 rounded-2xl w-fit shadow-inner">
                        <i data-lucide="car" class="h-8 w-8 text-primary"></i>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 dark:from-white dark:via-slate-200 dark:to-white">
                        Bem-vindo
                    </h1>
                    <p class="text-[13px] font-medium text-slate-500 max-w-[80%] mx-auto leading-relaxed">
                        Inicie sessão para gerir a sua próxima viagem.
                    </p>
                </div>
                
                <!-- Authentication Component -->
                <div class="p-6 pt-0">
                    
                    <!-- Premium Tabs Selection -->
                    <div class="grid grid-cols-2 p-1.5 mb-5 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 backdrop-blur-sm shadow-inner">
                        <a th:href="@{/auth(tab='login')}" 
                                th:classappend="${tab == 'login' ? 'bg-white dark:bg-slate-700 text-primary shadow-md' : 'text-slate-500 hover:text-slate-700'}"
                                class="flex items-center justify-center py-2 text-xs font-bold rounded-lg transition-all duration-300">
                            Entrar
                        </a>
                        <a th:href="@{/auth(tab='register')}" 
                                th:classappend="${tab == 'register' ? 'bg-white dark:bg-slate-700 text-primary shadow-md' : 'text-slate-500 hover:text-slate-700'}"
                                class="flex items-center justify-center py-2 text-xs font-bold rounded-lg transition-all duration-300">
                            Registar
                        </a>
                    </div>
                    
                    <!-- Refined Flash Messages -->
                    <div th:if="${error} or ${param.error}" class="animate-in fade-in slide-in-from-top-2 duration-300 bg-red-500/10 border border-red-500/20 text-red-600 text-[11px] font-medium p-3 rounded-xl mb-4 flex items-center gap-2">
                        <i data-lucide="alert-circle" class="h-4 w-4"></i>
                        <span th:text="${error} ?: ${param.error}"></span>
                    </div>
                    <div th:if="${success}" class="animate-in fade-in slide-in-from-top-2 duration-300 bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 text-[11px] font-medium p-3 rounded-xl mb-4 flex items-center gap-2">
                        <i data-lucide="check-circle" class="h-4 w-4"></i>
                        <span th:text="${success}"></span>
                    </div>
                    
                <!-- Shared Form Content Area -->
                <div th:if="${tab == 'register'}">
                    <div th:replace="~{fragments/auth-forms :: register-form}"></div>
                </div>
                <div th:if="${tab != 'register'}">
                    <div th:replace="~{fragments/auth-forms :: login-form}"></div>
                </div>

            </div>
            
        </div>
    </div>
</div>
</body>
</html>
