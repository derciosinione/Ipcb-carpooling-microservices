<!-- Fragment: Step Navigation -->
<div th:fragment="stepNavigation">
    <div class="flex items-center justify-between mb-8">
        <template x-for="s in [1, 2, 3]">
            <div class="flex flex-col items-center gap-2 flex-1 relative">
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-colors z-10"
                     :class="step >= s ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground'"
                     x-text="s">
                </div>
                <span class="text-xs" :class="step >= s ? 'font-medium' : 'text-muted-foreground'"
                      x-text="s === 1 ? 'Itinerário' : s === 2 ? 'Detalhes' : 'Revisão'"></span>
                <div x-show="s < 3" class="absolute top-4 left-1/2 w-full h-[2px] -z-0"
                     :class="step > s ? 'bg-primary' : 'bg-muted'"></div>
            </div>
        </template>
    </div>
</div>
