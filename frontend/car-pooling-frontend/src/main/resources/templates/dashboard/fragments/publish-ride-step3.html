<!-- Fragment: Step 3 - Review -->
<div th:fragment="stepReview">
    <div x-show="step === 3" style="display: none;" class="transition-opacity duration-200">
        <div class="flex flex-col space-y-1.5 p-6">
            <h3 class="font-semibold leading-none tracking-tight">Rever e Publicar</h3>
            <p class="text-sm text-muted-foreground">Confirme os detalhes da sua viagem antes de publicar.</p>
        </div>
        <div class="p-6 pt-0 space-y-6">
             <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                 <div class="space-y-4">
                    <div>
                        <h3 class="text-sm font-medium text-muted-foreground">Itinerário</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <i data-lucide="map-pin" class="h-4 w-4"></i>
                            <span class="font-semibold" x-text="formData.origin + ' → ' + formData.destination"></span>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium text-muted-foreground">Data e Hora</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <i data-lucide="calendar" class="h-4 w-4"></i>
                            <span x-text="formData.date + ' às ' + formData.time"></span>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <h3 class="text-sm font-medium text-muted-foreground">Veículo e Lugares</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <i data-lucide="car" class="h-4 w-4"></i>
                            <span x-text="(formData.vehicle === 'golf' ? 'Volkswagen Golf' : 'Peugeot 208') + ' • ' + formData.seats + ' lugares'"></span>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium text-muted-foreground">Divisão de custos</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <i data-lucide="calculator" class="h-4 w-4"></i>
                            <span class="text-sm">Custos apurados durante a viagem e divididos pelos viajantes.</span>
                        </div>
                    </div>
                </div>
             </div>
             <div x-show="formData.description" class="mt-4 p-4 bg-muted/30 rounded-lg">
                <h3 class="text-sm font-medium text-muted-foreground mb-1">Notas do condutor</h3>
                <p class="text-sm" x-text="formData.description"></p>
            </div>
        </div>
        <div class="flex items-center p-6 pt-0 justify-between">
            <button @click="step--" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">Voltar</button>
            <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-green-600 hover:bg-green-700 text-white h-10 px-4 py-2">Publicar Boleia</button>
        </div>
    </div>
</div>
