<!-- Fragment: Driver Info (Passenger view) -->
<div th:fragment="rideDriver">
    <div x-show="!isDriver" class="rounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="flex flex-col space-y-1.5 p-6 pb-3">
             <h3 class="font-semibold leading-none tracking-tight text-lg">Condutor</h3>
        </div>
         <div class="p-6 pt-0">
             <div class="flex items-center justify-between">
                <a href="#" class="flex items-center gap-3 cursor-pointer hover:bg-muted/50 p-2 rounded-lg -ml-2 transition-colors flex-1">
                    <span class="relative flex h-12 w-12 shrink-0 overflow-hidden rounded-full border-2 border-primary/20">
                        <img class="aspect-square h-full w-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=100" />
                    </span>
                    <div>
                        <div class="flex items-center gap-1">
                            <p class="font-bold text-base" th:text="${userNames != null && trip != null && userNames[trip.driverId] != null ? userNames[trip.driverId] : 'Condutor'}">Condutor</p>
                            <i data-lucide="badge-check" class="h-4 w-4 text-blue-500"></i>
                        </div>
                        <p class="text-sm text-muted-foreground flex items-center gap-1">
                            <i data-lucide="star" class="h-3 w-3 fill-yellow-400 text-yellow-400"></i>
                            <span class="font-medium text-foreground">5.0</span>
                            <span>•</span>
                            <span>Condutor verificado</span>
                        </p>
                    </div>
                </a>
                <div class="flex gap-2">
                    <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2 gap-2">
                        <i data-lucide="message-square" class="h-4 w-4"></i>
                        Mensagem
                    </button>
                </div>
            </div>
         </div>
    </div>
</div>
