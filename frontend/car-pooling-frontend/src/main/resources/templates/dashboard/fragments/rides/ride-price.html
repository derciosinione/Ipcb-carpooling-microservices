<!-- Fragment: Price Card -->
<div th:fragment="ridePrice">
    <div class="rounded-lg border text-card-foreground shadow-sm bg-primary/5 border-primary/20">
        <div class="flex flex-col space-y-1.5 p-6 pb-2">
            <div class="flex justify-between items-center">
                <h3 class="font-semibold leading-none tracking-tight text-lg">Custo por pessoa</h3>
            </div>
        </div>
        <div class="p-6 pt-0">
            <div class="flex items-baseline justify-between">
                <span class="text-3xl font-bold text-primary" th:text="${trip != null && trip.costPerSeat != null ? '€' + #numbers.formatDecimal(trip.costPerSeat, 1, 2) : '€0,00'}">€0,00</span>
                <span class="text-sm text-muted-foreground">Pagamento pendente</span>
            </div>
            <div data-orientation="horizontal" role="none" class="shrink-0 bg-border h-[1px] w-full my-4 bg-primary/20"></div>
            <div class="flex items-center gap-2 text-sm text-muted-foreground">
                <i data-lucide="euro" class="h-4 w-4"></i>
                <span>O valor total pode variar com despesas extra.</span>
            </div>
        </div>
    </div>
</div>
