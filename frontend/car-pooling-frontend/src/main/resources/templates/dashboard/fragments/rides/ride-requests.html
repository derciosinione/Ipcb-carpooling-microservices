<!-- Fragment: Ride Requests (Driver only) -->
<div th:fragment="rideRequests">
    <div x-show="isDriver && !isCompleted" class="rounded-lg border text-card-foreground shadow-sm border-blue-200 bg-blue-50/30">
        <div class="flex flex-col space-y-1.5 p-6 pb-3">
            <h3 class="font-semibold leading-none tracking-tight text-lg flex items-center gap-2">
                <i data-lucide="users" class="h-5 w-5 text-blue-600"></i>
                Pedidos de Reserva
                <div class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent text-secondary-foreground ml-2 bg-blue-100 text-blue-700 hover:bg-blue-100" th:text="${pendingBookings != null ? pendingBookings.size() : 0} + ' pendentes'">0 pendentes</div>
            </h3>
        </div>
        <div class="p-6 pt-0 space-y-4">
            <div th:if="${#lists.isEmpty(pendingBookings)}" class="text-sm text-muted-foreground">
                Sem pedidos pendentes.
            </div>

            <div th:each="booking : ${pendingBookings}" class="flex items-center justify-between bg-background p-3 rounded-lg border shadow-sm">
                <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
                    <span class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full">
                        <img class="aspect-square h-full w-full" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" />
                    </span>
                    <div>
                        <p class="font-medium text-sm" th:text="${'Utilizador ' + #strings.substring(booking.passengerId, 0, 6)}">Utilizador</p>
                        <div class="flex items-center gap-2 text-xs text-muted-foreground">
                            <span class="flex items-center gap-0.5">★ 5.0</span>
                            <span>•</span>
                            <span th:text="${booking.seats + ' lugar(es)'}">1 lugar</span>
                        </div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <form th:action="@{'/dashboard/ride/' + ${trip.id} + '/bookings/' + ${booking.id} + '/reject'}" method="post">
                        <button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 text-red-600 hover:text-red-700 hover:bg-red-50 border-red-200 border bg-transparent" title="Recusar">
                            <i data-lucide="x" class="h-4 w-4"></i>
                        </button>
                    </form>
                    <form th:action="@{'/dashboard/ride/' + ${trip.id} + '/bookings/' + ${booking.id} + '/accept'}" method="post">
                        <button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 bg-green-600 hover:bg-green-700 text-white" title="Aceitar">
                            <i data-lucide="check" class="h-4 w-4"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
