<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout}">
<head>
    <title>Dashboard</title>
</head>
<body>
    <div layout:fragment="content" th:attr="x-data=|{ isDriver: ${defaultIsDriver} }|">
        <div th:replace="dashboard/fragments/home/home-header :: homeHeader"></div>
        
        <div th:replace="dashboard/fragments/home/home-stats :: statsGrid"></div>

        <div class="flex flex-col gap-4 lg:flex-row">
            <div th:replace="dashboard/fragments/home/home-upcoming :: upcomingRides"></div>
            
             <div th:replace="dashboard/fragments/home/home-actions :: quickActions"></div>
        </div>
    </div>
</body>
</html>
