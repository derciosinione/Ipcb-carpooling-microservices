<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPooling - Dashboard</title>
     <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                container: {
                    center: true,
                    padding: "2rem",
                    screens: {
                        "2xl": "1400px",
                    },
                },
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        popover: {
                            DEFAULT: "hsl(var(--popover))",
                            foreground: "hsl(var(--popover-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                },
            },
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-muted/20 font-sans" x-data="{ isMobileMenuOpen: false }">

    <div class="flex">
        <!-- Desktop Sidebar -->
        <aside class="hidden md:block w-64 bg-background border-r h-screen sticky top-0">
            <div class="flex flex-col h-full">
                <div class="p-6">
                    <a th:href="@{/dashboard}" class="flex items-center gap-2 font-bold text-xl text-primary cursor-pointer">
                         <i data-lucide="car" class="h-6 w-6"></i>
                        <span>CarPooling</span>
                    </a>
                </div>
                
                <div class="flex-1 px-4 space-y-2">
                    <a th:href="@{/dashboard}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 w-full justify-start gap-3 bg-primary/10 text-primary hover:bg-primary/20">
                         <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
                        Dashboard
                    </a>
                    <a th:href="@{/dashboard/rides}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full justify-start gap-3 text-muted-foreground">
                         <i data-lucide="map" class="h-5 w-5"></i>
                        As Minhas Viagens
                    </a>
                    <a th:href="@{/dashboard/vehicles}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full justify-start gap-3 text-muted-foreground">
                         <i data-lucide="car" class="h-5 w-5"></i>
                        Os Meus Veículos
                    </a>
                    <a th:href="@{/dashboard/messages}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full justify-start gap-3 text-muted-foreground">
                         <i data-lucide="message-square" class="h-5 w-5"></i>
                        Mensagens
                    </a>
                    <a th:href="@{/dashboard/settings}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full justify-start gap-3 text-muted-foreground">
                         <i data-lucide="settings" class="h-5 w-5"></i>
                        Preferências
                    </a>
                </div>

                <div class="p-4 border-t mt-auto">
                    <a th:href="@{/}" class="inline-flex items-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 w-full justify-start gap-3 text-red-500 hover:text-red-600 hover:bg-red-50 hover:bg-accent">
                         <i data-lucide="log-out" class="h-5 w-5"></i>
                        Sair
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-h-screen">
            <!-- Header -->
            <header class="h-16 bg-background border-b px-4 flex items-center justify-between sticky top-0 z-10">
                <div class="md:hidden">
                    <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 w-10">
                         <i data-lucide="menu" class="h-6 w-6"></i>
                    </button>
                </div>

                <div class="ml-auto flex items-center gap-4">
                    <div class="relative" x-data="{ open: false, notifications: [
                        { id: 1, title: 'Reserva Confirmada', message: 'O João Silva confirmou a reserva.', time: 'Há 5 min', read: false, type: 'success' },
                        { id: 2, title: 'Lembrete de Viagem', message: 'A sua viagem para Faro é amanhã.', time: 'Há 1 hora', read: false, type: 'info' },
                        { id: 3, title: 'Pagamento Recebido', message: 'Recebeu €15,00 da viagem de ontem.', time: 'Há 3 horas', read: true, type: 'success' }
                    ]}">
                        <button @click="open = !open" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 w-10 rounded-full relative">
                            <i data-lucide="bell" class="h-5 w-5"></i>
                            <span x-show="notifications.some(n => !n.read)" class="absolute top-2 right-2 h-2.5 w-2.5 rounded-full bg-red-500 border-2 border-background"></span>
                        </button>

                        <div x-show="open" @click.outside="open = false" class="absolute right-0 z-50 mt-2 w-80 origin-top-right rounded-md border bg-popover p-0 text-popover-foreground shadow-md outline-none animate-in fade-in-0 zoom-in-95" style="display: none;">
                            <div class="flex items-center justify-between p-4 bg-muted/30 border-b">
                                <h4 class="font-semibold leading-none">Notificações</h4>
                                <span class="text-xs text-muted-foreground" x-text="notifications.filter(n => !n.read).length + ' por ler'"></span>
                            </div>
                            <div class="max-h-[300px] overflow-y-auto">
                                <template x-for="notification in notifications" :key="notification.id">
                                    <div class="p-4 hover:bg-muted/50 transition-colors cursor-pointer border-b last:border-0" :class="!notification.read ? 'bg-blue-50/50' : ''">
                                        <div class="flex items-start gap-3">
                                            <div class="mt-1 p-1 rounded-full" :class="notification.type === 'success' ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600'">
                                                <i x-show="notification.type === 'success'" data-lucide="check" class="h-3 w-3"></i>
                                                <i x-show="notification.type === 'info'" data-lucide="info" class="h-3 w-3"></i>
                                            </div>
                                            <div class="space-y-1 flex-1">
                                                <p class="text-sm font-medium leading-none" x-text="notification.title"></p>
                                                <p class="text-xs text-muted-foreground line-clamp-2" x-text="notification.message"></p>
                                                <p class="text-[10px] text-muted-foreground flex items-center gap-1 pt-1">
                                                    <i data-lucide="clock" class="h-3 w-3"></i> <span x-text="notification.time"></span>
                                                </p>
                                            </div>
                                            <div x-show="!notification.read" class="h-2 w-2 bg-blue-500 rounded-full mt-2"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="p-2 border-t">
                                <a href="/dashboard/notifications" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-xs font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-full">
                                    Ver todas as notificações
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 pl-4 border-l">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold" th:text="${session.userName != null ? session.userName : 'Utilizador'}">Ricardo Sousa</p>
                            <p class="text-xs text-muted-foreground">Utilizador Verificado</p>
                        </div>
                        
                        <div class="relative" x-data="{ open: false }">
                            <span class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full cursor-pointer hover:opacity-80 transition-opacity" @click="open = !open">
                                <span class="flex h-full w-full items-center justify-center rounded-full bg-primary/10 text-primary font-bold" th:text="${session.userInitials != null ? session.userInitials : 'U'}">RS</span>
                            </span>
                             <div x-show="open" @click.outside="open = false" class="absolute right-0 z-50 mt-2 w-56 origin-top-right rounded-md border bg-popover p-1 text-popover-foreground shadow-md outline-none animate-in fade-in-0 zoom-in-95" style="display: none;">
                                <div class="px-2 py-1.5 text-sm font-semibold">A minha conta</div>
                                <div class="h-px bg-muted my-1"></div>
                                <div class="relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground hover:bg-accent">
                                    <i data-lucide="user" class="mr-2 h-4 w-4"></i>
                                    <span>Meu Perfil</span>
                                </div>
                                <div class="relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground hover:bg-accent">
                                    <i data-lucide="settings" class="mr-2 h-4 w-4"></i>
                                    <span>Preferências</span>
                                </div>
                                <div class="h-px bg-muted my-1"></div>
                                <div class="relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground hover:bg-accent text-red-600 focus:text-red-600 focus:bg-red-50">
                                    <i data-lucide="log-out" class="mr-2 h-4 w-4"></i>
                                    <span>Sair</span>
                                </div>
                             </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-4 md:p-8 overflow-y-auto" layout:fragment="content">
                <!-- Dashboard content -->
            </main>
        </div>
    </div>
    
    <!-- Invite Modal Integration -->
    <div th:replace="~{fragments/modals :: invite-friends-modal}"></div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
