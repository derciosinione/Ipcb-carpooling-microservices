<!DOCTYPE html>
<html lang="pt"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout}">
<head>
    <title>Notificações</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6 p-4 md:p-8 pt-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Notificações</h1>
            <p class="text-muted-foreground mt-2">Fique a par de todas as atualizações das suas viagens e conta.</p>
        </div>
        <div class="flex gap-2">
            <form th:action="@{/dashboard/notifications/read-all}" method="post">
                <button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium border border-input bg-background hover:bg-accent h-9 px-3 gap-2">
                    <i data-lucide="check" class="h-4 w-4"></i> Marcar todas como lidas
                </button>
            </form>
        </div>
    </div>

    <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm" th:text="${error}">Erro</div>

    <div class="inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground grid w-full max-w-md grid-cols-2">
        <a th:href="@{/dashboard/notifications(filter='all')}" th:classappend="${filter == 'all'} ? ' bg-background text-foreground shadow-sm' : ''" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium transition-all">Todas</a>
        <a th:href="@{/dashboard/notifications(filter='unread')}" th:classappend="${filter == 'unread'} ? ' bg-background text-foreground shadow-sm' : ''" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium transition-all">Não Lidas</a>
    </div>

    <div class="space-y-4">
        <div th:if="${#lists.isEmpty(notifications)}" class="rounded-lg border bg-card p-6 text-sm text-muted-foreground">Sem notificações.</div>
        <div th:each="notification : ${notifications}"
             class="rounded-lg border bg-card shadow-sm transition-all"
             th:classappend="${!notification.read} ? ' border-l-4 border-l-primary' : ''">
            <div class="p-6">
                <div class="flex items-start gap-4">
                    <div class="mt-1 p-2 rounded-full bg-muted">
                        <i data-lucide="bell" class="h-5 w-5 text-blue-500"></i>
                    </div>
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center justify-between">
                            <h4 class="font-semibold" th:classappend="${!notification.read} ? ' text-primary' : ''" th:text="${notification.title}">Título</h4>
                            <span class="text-xs text-muted-foreground" th:text="${notification.createdAt != null ? #temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm') : ''}">agora</span>
                        </div>
                        <p class="text-sm text-muted-foreground" th:text="${notification.message}">Mensagem</p>
                        <div class="flex items-center gap-4 pt-2">
                            <span th:if="${!notification.read}" class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-semibold border-blue-200 bg-blue-50 text-blue-700">Nova</span>
                            <span th:if="${notification.read}" class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-semibold border-slate-200 bg-slate-50 text-slate-700">Lida</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <form th:if="${!notification.read}" th:action="@{'/dashboard/notifications/' + ${notification.id} + '/read'}" method="post">
                            <button type="submit" class="inline-flex items-center justify-center rounded-md h-8 w-8 hover:bg-accent text-muted-foreground" title="Marcar como lida">
                                <i data-lucide="check" class="h-4 w-4"></i>
                            </button>
                        </form>
                        <form th:action="@{'/dashboard/notifications/' + ${notification.id} + '/delete'}" method="post">
                            <button type="submit" class="inline-flex items-center justify-center rounded-md h-8 w-8 hover:bg-accent text-muted-foreground hover:text-red-600" title="Eliminar">
                                <i data-lucide="trash-2" class="h-4 w-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
