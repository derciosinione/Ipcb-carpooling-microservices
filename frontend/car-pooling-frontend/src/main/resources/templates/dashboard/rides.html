<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout}">
<head>
    <title>As Minhas Viagens</title>
</head>
<body>
    <div layout:fragment="content" class="container mx-auto p-4 md:p-8 pt-6 space-y-6" x-data="{ currentTab: 'upcoming', isDriver: true }">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-bold tracking-tight">As Minhas Viagens</h1>
              <p class="text-muted-foreground mt-2">
                Gerencie as suas boleias agendadas e consulte o histórico.
              </p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center space-x-2 bg-muted p-1 rounded-lg">
                    <button @click="isDriver = false" 
                            :class="!isDriver ? 'bg-background shadow-sm text-foreground' : 'text-muted-foreground hover:text-foreground'"
                            class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">
                        Passageiro
                    </button>
                    <button @click="isDriver = true"
                            :class="isDriver ? 'bg-background shadow-sm text-foreground' : 'text-muted-foreground hover:text-foreground'"
                            class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">
                        Condutor
                    </button>
                </div>
                <a href="/dashboard/publish-ride" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2">
                    Publicar nova boleia
                </a>
            </div>
        </div>

        <!-- Alpine.js Tabs -->
        <div class="space-y-4">
            <div class="inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground grid w-full grid-cols-2 lg:w-[400px]">
                <button @click="currentTab = 'upcoming'" 
                        :class="{ 'bg-background text-foreground shadow-sm': currentTab === 'upcoming' }"
                        class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
                    Agendadas
                </button>
                <button @click="currentTab = 'history'" 
                        :class="{ 'bg-background text-foreground shadow-sm': currentTab === 'history' }"
                        class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
                    Histórico
                </button>
            </div>

            <div x-show="currentTab === 'upcoming'" class="space-y-4 mt-6">
                <!-- Mock Ride Card 1 -->
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-4 hover:shadow-md transition-shadow cursor-pointer">
                    <div class="p-6">
                        <div class="flex flex-col md:flex-row justify-between gap-4">
                            <div class="flex-1 space-y-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class="flex flex-col items-center justify-center border rounded-lg p-2 w-16 h-16 bg-muted/20 shrink-0">
                                            <span class="text-[10px] font-bold uppercase text-muted-foreground">OUT</span>
                                            <span class="text-xl font-bold">Hoje</span>
                                        </div>
                                        <div class="flex flex-col">
                                            <div class="flex items-center gap-2 text-sm text-foreground font-semibold">
                                                <i data-lucide="clock" class="h-4 w-4 text-muted-foreground"></i>
                                                <span>17:30</span>
                                            </div>
                                            <span class="text-xs text-muted-foreground capitalize">Hoje</span>
                                        </div>
                                    </div>
                                    <div class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent bg-green-500 hover:bg-green-600 text-white">Confirmado</div>
                                </div>

                                <div class="flex items-center gap-4 pl-1">
                                    <div class="flex flex-col items-center gap-1">
                                        <div class="w-2.5 h-2.5 rounded-full bg-background border-2 border-foreground"></div>
                                        <div class="w-0.5 h-8 bg-muted"></div>
                                        <div class="w-2.5 h-2.5 rounded-full bg-foreground"></div>
                                    </div>
                                    <div class="flex flex-col justify-between h-14">
                                        <span class="font-semibold">Lisboa</span>
                                        <span class="font-semibold">Faro</span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-4 text-sm">
                                    <div class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent bg-secondary text-secondary-foreground hover:bg-secondary/80 font-normal">Condutor</div>
                                    <span class="text-muted-foreground">3 passageiros</span>
                                </div>
                            </div>

                            <div class="flex md:flex-col justify-between items-end border-t md:border-t-0 md:border-l pt-4 md:pt-0 md:pl-6 gap-2">
                                <div class="text-right">
                                    <p class="text-xs text-muted-foreground">Valor total</p>
                                    <p class="text-xl font-bold text-primary">14,00 €</p>
                                </div>
                                <div class="flex gap-2">
                                    <a href="/dashboard/ride/1?openExpenses=true" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3 gap-1">
                                        <i data-lucide="calculator" class="h-4 w-4"></i> Gastos
                                    </a>
                                    <a href="/dashboard/ride/1" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 px-3 gap-1">
                                        Detalhes <i data-lucide="chevron-right" class="h-4 w-4"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="currentTab === 'history'" class="space-y-4 mt-6" style="display: none;">
                 <!-- Mock History Card -->
                 <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-4 hover:shadow-md transition-shadow cursor-pointer opacity-80">
                    <div class="p-6">
                        <div class="flex flex-col md:flex-row justify-between gap-4">
                            <div class="flex-1 space-y-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class="flex flex-col items-center justify-center border rounded-lg p-2 w-16 h-16 bg-muted/20 shrink-0">
                                            <span class="text-[10px] font-bold uppercase text-muted-foreground">OUT</span>
                                            <span class="text-xl font-bold">20</span>
                                        </div>
                                        <div class="flex flex-col">
                                            <div class="flex items-center gap-2 text-sm text-foreground font-semibold">
                                                <i data-lucide="clock" class="h-4 w-4 text-muted-foreground"></i>
                                                <span>08:00</span>
                                            </div>
                                            <span class="text-xs text-muted-foreground capitalize">20 Out</span>
                                        </div>
                                    </div>
                                    <div class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 text-foreground">Concluído</div>
                                </div>

                                <div class="flex items-center gap-4 pl-1">
                                    <div class="flex flex-col items-center gap-1">
                                        <div class="w-2.5 h-2.5 rounded-full bg-background border-2 border-foreground"></div>
                                        <div class="w-0.5 h-8 bg-muted"></div>
                                        <div class="w-2.5 h-2.5 rounded-full bg-foreground"></div>
                                    </div>
                                    <div class="flex flex-col justify-between h-14">
                                        <span class="font-semibold">Porto</span>
                                        <span class="font-semibold">Lisboa</span>
                                    </div>
                                </div>
                            </div>

                                <div class="flex gap-2">
                                    <a href="/dashboard/ride/1?status=completed" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 px-3 gap-1">
                                        Detalhes <i data-lucide="chevron-right" class="h-4 w-4"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>
