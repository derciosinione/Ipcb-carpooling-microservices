<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout}">
<head>
    <title>Os Meus Veículos</title>
</head>
<body>
    <div layout:fragment="content" class="p-4 md:p-8 pt-6 space-y-8" x-data="{ isModalOpen: false, activeTab: 'details' }">
        
        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-lg flex items-center gap-2 animate-in fade-in slide-in-from-top-2">
            <i data-lucide="check-circle" class="h-5 w-5"></i>
            <span th:text="${success}">Operação realizada com sucesso!</span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center gap-2 animate-in fade-in slide-in-from-top-2">
            <i data-lucide="alert-circle" class="h-5 w-5"></i>
            <span th:text="${error}">Ocorreu um erro ao processar o seu pedido.</span>
        </div>

        <div class="flex items-center justify-between">
            <div>
              <h1 class="text-3xl font-bold tracking-tight">Os Meus Veículos</h1>
              <p class="text-muted-foreground mt-2">Adicione e gerencie os carros que utiliza para dar boleias.</p>
            </div>
            <button @click="isModalOpen = true" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 gap-2">
                <i data-lucide="plus" class="h-4 w-4"></i>
                Adicionar Veículo
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Real Vehicles List -->
            <th:block th:each="vehicle : ${vehicles}">
                <div th:replace="~{fragments/vehicle-card :: vehicle-card(${vehicle})}"></div>
            </th:block>

             <!-- Add New Card Button -->
             <button @click="isModalOpen = true" class="flex flex-col items-center justify-center h-full min-h-[380px] border-2 border-dashed rounded-xl border-muted-foreground/25 hover:border-primary/50 hover:bg-muted/30 transition-all gap-4 group">
                <div class="h-16 w-16 rounded-full bg-muted flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="plus" class="h-8 w-8 text-muted-foreground"></i>
                </div>
                <div class="text-center">
                    <h3 class="font-semibold text-lg">Adicionar outro veículo</h3>
                    <p class="text-sm text-muted-foreground">Registe um novo carro para as suas viagens</p>
                </div>
            </button>
        </div>

        <!-- Add Vehicle Modal Fragment -->
        <div th:replace="~{modals/add-vehicle-modal :: add-vehicle-modal}"></div>
    </div>
</body>
</html>
