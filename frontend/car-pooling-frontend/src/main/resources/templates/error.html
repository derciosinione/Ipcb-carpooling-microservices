<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/auth-layout}">
<head>
    <title>Erro - CarPooling</title>
</head>
<body>
    <div layout:fragment="content" class="h-screen w-full flex items-center justify-center p-4 relative overflow-hidden">
        
        <div class="absolute inset-0 z-0 pointer-events-none">
            <div class="absolute top-[30%] right-[15%] w-[35%] h-[35%] rounded-full bg-red-500/5 blur-[100px]"></div>
        </div>

        <div class="relative z-10 text-center space-y-8 max-w-md animate-in fade-in slide-in-from-bottom-5 duration-700">
            <div class="bg-red-500/10 p-6 rounded-3xl backdrop-blur-sm border border-red-500/20 shadow-2xl inline-block">
                <i data-lucide="alert-triangle" class="h-16 w-16 text-red-500"></i>
            </div>

            <div class="space-y-3">
                <h1 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Algo correu mal</h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium">Ocorreu um erro inesperado ao processar o seu pedido. A nossa equipa foi notificada.</p>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a th:href="@{/}" class="group relative inline-flex items-center justify-center rounded-xl bg-slate-900 px-6 py-3 text-sm font-bold text-white transition-all hover:bg-slate-800 active:scale-95 w-full sm:w-auto overflow-hidden">
                    <span class="relative flex items-center gap-2">
                        <i data-lucide="home" class="h-4 w-4"></i>
                        Voltar ao Início
                    </span>
                </a>
                <button onclick="location.reload()" class="inline-flex items-center justify-center rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 px-6 py-3 text-sm font-bold text-slate-700 dark:text-slate-300 transition-all hover:bg-slate-50 dark:hover:bg-slate-900 active:scale-95 w-full sm:w-auto gap-2">
                    <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                    Tentar Novamente
                </button>
            </div>
        </div>
    </div>
</body>
</html>
