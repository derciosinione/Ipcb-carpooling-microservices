services:
  car-pooling-web:
    build: .
    image: car-pooling/web:latest
    container_name: car-pooling-web
    ports:
      - "3002:3002"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Pointing to the gateway by its service name in the overlay network
      - GATEWAY_URL=http://cloud-gateway:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - carpooling_network

networks:
  carpooling_network:
    external: true
