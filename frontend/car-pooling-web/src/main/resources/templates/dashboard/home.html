<!DOCTYPE html>
<html lang="pt" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/layout}">
<head>
    <title>Dashboard</title>
</head>
<body>
    <div layout:fragment="content" x-data="{ isDriver: true }">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold tracking-tight">Dashboard</h1>
            <div class="flex items-center space-x-2 bg-muted p-1 rounded-lg">
                <button @click="isDriver = false" 
                        :class="!isDriver ? 'bg-background shadow-sm text-foreground' : 'text-muted-foreground hover:text-foreground'"
                        class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">
                    Passageiro
                </button>
                <button @click="isDriver = true"
                        :class="isDriver ? 'bg-background shadow-sm text-foreground' : 'text-muted-foreground hover:text-foreground'"
                        class="px-3 py-1.5 text-sm font-medium rounded-md transition-all">
                    Condutor
                </button>
            </div>
        </div>

        <p class="text-muted-foreground mb-8" x-text="isDriver ? 'Bem-vindo de volta, Ricardo! Aqui está o resumo da sua atividade como condutor.' : 'Bem-vindo de volta, Ricardo! Aqui está o resumo das suas viagens como passageiro.'"></p>
        
        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 mb-8">
            <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                    <h3 class="tracking-tight text-sm font-medium" x-text="isDriver ? 'Total de Viagens' : 'Viagens Realizadas'"></h3>
                    <i data-lucide="map" class="h-4 w-4 text-muted-foreground"></i>
                </div>
                <div class="p-6 pt-0">
                    <div class="text-2xl font-bold" x-text="isDriver ? '342' : '48'"></div>
                    <p class="text-xs text-muted-foreground flex items-center gap-1">
                        <span class="text-green-500 flex items-center" x-text="isDriver ? '+12%' : '+4%'"></span>
                        desde o mês passado
                    </p>
                </div>
            </div>
            
             <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                    <h3 class="tracking-tight text-sm font-medium" x-text="isDriver ? 'Ganhos Totais' : 'Poupança Estimada'"></h3>
                    <i x-show="isDriver" data-lucide="wallet" class="h-4 w-4 text-muted-foreground"></i>
                    <i x-show="!isDriver" data-lucide="piggy-bank" class="h-4 w-4 text-muted-foreground"></i>
                </div>
                <div class="p-6 pt-0">
                    <div class="text-2xl font-bold" x-text="isDriver ? '€1,240.50' : '€320.00'"></div>
                    <p class="text-xs text-muted-foreground flex items-center gap-1">
                        <span class="text-green-500 flex items-center" x-text="isDriver ? '+4.5%' : '+8.2%'"></span>
                        desde o mês passado
                    </p>
                </div>
            </div>

             <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                    <h3 class="tracking-tight text-sm font-medium">Avaliação Média</h3>
                    <i data-lucide="star" class="h-4 w-4 text-muted-foreground"></i>
                </div>
                <div class="p-6 pt-0">
                    <div class="text-2xl font-bold" x-text="isDriver ? '4.9/5.0' : '5.0/5.0'"></div>
                    <p class="text-xs text-muted-foreground" x-text="isDriver ? 'Baseado em 124 avaliações' : 'Baseado em 42 avaliações'"></p>
                </div>
            </div>
            
             <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
                    <h3 class="tracking-tight text-sm font-medium" x-text="isDriver ? 'Km Percorridos' : 'Km Viajados'"></h3>
                    <i data-lucide="map-pin" class="h-4 w-4 text-muted-foreground"></i>
                </div>
                <div class="p-6 pt-0">
                    <div class="text-2xl font-bold" x-text="isDriver ? '12,450 km' : '3,200 km'"></div>
                    <p class="text-xs text-muted-foreground">Total acumulado</p>
                </div>
            </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-7">
            <div class="col-span-4 rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="flex flex-col space-y-1.5 p-6">
                    <h3 class="font-semibold leading-none tracking-tight">Próximas Viagens</h3>
                    <p class="text-sm text-muted-foreground">As suas viagens agendadas.</p>
                </div>
                <div class="p-6 pt-0">
                    <div class="space-y-6">
                        <!-- Ride Items Wrapper -->
                        <div x-data="{ rides: [
                            { date: 'Hoje', time: '17:30', from: 'Lisboa', to: 'Faro', status: 'Confirmado', role: 'Condutor', passengers: 3, price: '€25.00', id: 1 },
                            { date: 'Amanhã', time: '09:00', from: 'Faro', to: 'Lisboa', status: 'Pendente', role: 'Condutor', passengers: 1, price: '€25.00', id: 2 },
                            { date: 'Sexta', time: '18:00', from: 'Lisboa', to: 'Porto', status: 'Confirmado', role: 'Passageiro', driver: 'Ana S.', price: '€18.50', id: 3 }
                        ]}">
                            <template x-for="ride in rides.filter(r => isDriver ? r.role === 'Condutor' : r.role === 'Passageiro')" :key="ride.id">
                                <a :href="'/dashboard/ride/' + ride.id" class="flex items-center justify-between border-b last:border-0 pb-6 last:pb-0 hover:bg-muted/50 p-2 rounded-lg transition-colors cursor-pointer block">
                                    <div class="flex items-center gap-4">
                                        <div class="h-14 w-16 rounded-xl bg-muted/50 border flex flex-col items-center justify-center shrink-0">
                                            <i data-lucide="calendar" class="h-4 w-4 text-muted-foreground mb-1"></i>
                                            <span class="font-bold text-sm text-foreground" x-text="ride.date"></span>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-base flex items-center gap-2">
                                                <span x-text="ride.from"></span>
                                                <span class="text-muted-foreground">→</span> 
                                                <span x-text="ride.to"></span>
                                            </h4>
                                            <p class="text-sm text-muted-foreground mt-1">
                                                <span x-text="ride.time"></span> • <span x-text="ride.role"></span>
                                            </p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end gap-1.5">
                                        <div class="font-medium px-2.5 py-0.5 rounded-full text-xs"
                                             :class="ride.status === 'Confirmado' ? 'bg-green-100 text-green-700' : 'bg-muted text-foreground'">
                                            <span x-text="ride.status"></span>
                                        </div>
                                        <span class="text-xs text-muted-foreground" x-text="ride.role === 'Condutor' ? ride.passengers + ' passageiros' : 'Condutor: ' + ride.driver"></span>
                                    </div>
                                </a>
                            </template>
                             <div x-show="rides.filter(r => isDriver ? r.role === 'Condutor' : r.role === 'Passageiro').length === 0" class="text-center py-8 text-muted-foreground text-sm">
                                Nenhuma viagem encontrada para este perfil.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
             <div class="col-span-3 rounded-xl border bg-card text-card-foreground shadow-sm">
                <div class="flex flex-col space-y-1.5 p-6">
                    <h3 class="font-semibold leading-none tracking-tight">Ações Rápidas</h3>
                    <p class="text-sm text-muted-foreground">Gerencie sua atividade</p>
                </div>
                 <div class="p-6 pt-0 flex flex-col gap-4">
                    <template x-if="isDriver">
                        <div class="flex flex-col gap-4">
                            <a href="/dashboard/publish-ride" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full">
                                <i data-lucide="plus-circle" class="h-4 w-4 mr-2"></i>
                                Publicar nova boleia
                            </a>
                            <a href="/search" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full">
                                <i data-lucide="map-pin" class="h-4 w-4 mr-2"></i>
                                Procurar boleia (Passageiro)
                            </a>
                        </div>
                    </template>
                    <template x-if="!isDriver">
                        <div class="flex flex-col gap-4">
                            <a href="/search" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full">
                                <i data-lucide="search" class="h-4 w-4 mr-2"></i>
                                Procurar boleia
                            </a>
                            <a href="/dashboard/publish-ride" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full">
                                <i data-lucide="car" class="h-4 w-4 mr-2"></i>
                                Publicar viagem (Condutor)
                            </a>
                        </div>
                    </template>
                    <button @click="$dispatch('open-invite-modal')" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full">
                        <i data-lucide="users" class="h-4 w-4 mr-2"></i>
                        Convidar Amigos
                    </button>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>
